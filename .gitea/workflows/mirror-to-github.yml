name: Mirror to GitHub

# Gitea→GitHub one-way mirror per RFC-003 §3.1 (R3-3a).
# Gitea is canonical write + CI. GitHub is public read mirror for OSS visibility.
#
# Secret required (Gitea repo settings):
#   MIRROR_PAT — GitHub Personal Access Token for yannickgranger with `repo` scope.
#   (Secret names with GITHUB_ or GITEA_ prefix are reserved by Gitea Actions.)
#
# Scope: develop + main + tags only. Internal branches (work/*, fix/*, chore/*) stay private.
#
# Known race (surfaced at v0.5.0): on a push to `main`, this mirror and
# `release.yml` run in parallel. `release.yml` creates the `vX.Y.Z` tag, but
# this job's `git push github --force --tags` can run *before* that tag
# exists — and the tag-push event is emitted by the Actions token, which does
# NOT re-trigger workflows. Net effect: `main` mirrors but the new tag does
# not. Remedy: `workflow_dispatch` lets a maintainer re-run this mirror by
# hand after a release (it re-pushes `--tags`, syncing any tag created
# since). Any later push to develop/main also re-syncs all tags.

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  workflow_dispatch: {}

env:
  GIT_SSL_NO_VERIFY: true

jobs:
  mirror:
    name: Push to github.com/yannickgranger/graph-specs
    runs-on: rust
    container:
      image: docker.io/library/alpine:3
    steps:
      - name: Install deps
        run: |
          apk add --no-cache git bash curl ca-certificates

      - name: Clone from Gitea + push to GitHub
        env:
          GITEA_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_PAT: ${{ secrets.MIRROR_PAT }}
          GH_REPO: yannickgranger/graph-specs
          # Never let git fall back to an interactive prompt. Without this a
          # credential problem surfaces as the misleading
          # `could not read Password for 'https://***@github.com'` instead of
          # the actual authentication error.
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail

          # Defensive: strip any whitespace from PAT (Gitea UI doesn't trim on paste).
          # Done silently — PAT never echoed.
          GH_PAT=$(printf '%s' "${GH_PAT}" | tr -d '[:space:]')

          if [ -z "${GH_PAT}" ]; then
            echo "FATAL: MIRROR_PAT is empty or unset."
            echo "Set it in Gitea → repo Settings → Actions → Secrets."
            echo "It must be a GitHub PAT for yannickgranger with \`repo\` scope."
            exit 1
          fi

          git config --global --add safe.directory '*'
          git config --global http.sslVerify false
          git config --global url."https://oauth2:${GITEA_TOKEN}@${GITHUB_SERVER_URL#https://}/".insteadOf "${GITHUB_SERVER_URL}/"

          git clone --bare "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git" repo.git
          cd repo.git
          git fetch --tags origin

          # Configure GitHub remote with PAT auth (inline in URL — token never
          # persists on disk).
          #
          # `oauth2:<token>` — a USERNAME:PASSWORD pair, not a bare token as
          # username. `https://<token>@github.com` supplies a username with no
          # password, so git must source the password from somewhere; with no
          # credential helper and no tty it fails with
          # `could not read Password`. That is the v0.7.0 mirror failure.
          # This is the same form the Gitea remote above already uses.
          git remote add github "https://oauth2:${GH_PAT}@github.com/${GH_REPO}.git"

          # Scoped push: develop + main + tags only. Uses --force to accept Gitea as canonical.
          git push github --force refs/heads/develop:refs/heads/develop
          git push github --force refs/heads/main:refs/heads/main
          git push github --force --tags

          echo ""
          echo "Mirrored to https://github.com/${GH_REPO}"
